<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý thu phí chợ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f8f9fa; }
        h2 { text-align: center; color: #333; }
        .table-container { overflow-x: auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: #007bff; color: white; position: sticky; top: 0; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        tr:hover { background-color: #e9ecef; }
        .status-badge { padding: 5px 10px; border-radius: 20px; font-weight: bold; font-size: 12px; text-align: center; display: inline-block; min-width: 80px; }
        .status-unpaid { background-color: #ffeeba; color: #856404; border: 1px solid #ffeeba; }
        .status-paid { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        #loading { text-align: center; font-style: italic; color: #666; margin: 20px 0; }
    </style>
</head>
<body>

    <h2>Danh Sách Thu Phí Lô Sạp</h2>
    
    <div id="loading">Đang kết nối và tải dữ liệu từ Google Sheets...</div>

    <div class="table-container">
        <table id="dataTable" style="display: none;">
            <thead>
                <tr id="tableHead"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        // === DÁN URL WEB APP CỦA BẠN VÀO ĐÂY ===
        const API_URL = 'https://script.google.com/macros/s/AKfycbxEqlXyJ4uuzHTjwSeGahuE0a7zK2oc6or4wGM1qJ2CrQlIaxEkUr74OBN52tiq-rjD/exec';

        fetch(API_URL)
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('dataTable').style.display = 'table';
                
                if(data.length === 0) return;

                // Tạo tiêu đề cột linh hoạt
                const headers = Object.keys(data[0]);
                const thead = document.getElementById('tableHead');
                headers.forEach(header => {
                    let th = document.createElement('th');
                    th.textContent = header;
                    thead.appendChild(th);
                });

                // Đổ dữ liệu vào hàng
                const tbody = document.getElementById('tableBody');
                data.forEach(row => {
                    let tr = document.createElement('tr');
                    headers.forEach(header => {
                        let td = document.createElement('td');
                        
                        // Xử lý riêng giao diện cho cột "Trạng thái"
                        if (header.toLowerCase().includes('trạng thái')) {
                            let span = document.createElement('span');
                            let val = (row[header] || '').trim().toLowerCase();
                            span.textContent = row[header];
                            if (val === 'chưa đóng') {
                                span.className = 'status-badge status-unpaid';
                            } else if (val === 'đã đóng') {
                                span.className = 'status-badge status-paid';
                            } else {
                                span.textContent = row[header]; // Default
                            }
                            td.appendChild(span);
                        } else {
                            td.textContent = row[header] !== undefined ? row[header] : '';
                        }
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
            })
            .catch(error => {
                document.getElementById('loading').textContent = 'Lỗi kết nối dữ liệu!';
                console.error('Error fetching data:', error);
            });
    </script>
</body>
</html>
