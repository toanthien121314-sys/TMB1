<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thu diện tích bán hàng tại chợ Phước Hậu điểm 1</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f8f9fa; margin: 0; }
        h2 { text-align: center; color: #333; margin-bottom: 30px; }
        
        .menu-container { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .menu-btn { padding: 25px 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; color: white; display: flex; align-items: center; justify-content: center; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .menu-btn:hover { transform: translateY(-3px); }
        
        .btn-ds { background-color: #6c757d; grid-column: span 2; } 
        .btn-all { background-color: #007bff; }
        .btn-paid { background-color: #28a745; }
        .btn-unpaid { background-color: #ffc107; color: #333; }
        .btn-action { background-color: #dc3545; grid-column: span 2; padding: 20px; font-size: 18px; }

        .table-container { overflow-x: auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: #343a40; color: white; position: sticky; top: 0; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        tr:hover { background-color: #e9ecef; }
        
        .status-badge { padding: 5px 10px; border-radius: 20px; font-weight: bold; font-size: 12px; display: inline-block; min-width: 80px; text-align: center;}
        .status-unpaid { background-color: #ffeeba; color: #856404; }
        .status-paid { background-color: #d4edda; color: #155724; }
        
        .note-container { display: flex; justify-content: space-between; align-items: center; min-width: 100px; }
        .edit-icon { cursor: pointer; margin-left: 8px; font-size: 14px; opacity: 0.5; transition: 0.2s; }
        .edit-icon:hover { opacity: 1; transform: scale(1.2); }
        .note-text { flex-grow: 1; }
        
        .top-controls { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-bottom: 15px; }
        .back-btn { background-color: #6c757d; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .search-box { flex-grow: 1; max-width: 400px; }
        .search-box input { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 5px; font-size: 15px; box-sizing: border-box; }
        
        .mark-btn { background-color: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        .mark-btn:hover { background-color: #218838; }
        .undo-btn { background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        .undo-btn:hover { background-color: #c82333; }
        .col-action { width: 90px; text-align: center; }
        
        /* Chỉnh CSS cho Vách ngăn và Footer Kế toán */
        .row-debt td { background-color: #fff3cd !important; } 
        .section-divider td { background-color: #e2e3e5 !important; color: #383d41; font-weight: bold; font-size: 15px; text-align: center; padding: 12px; letter-spacing: 1px; }
        tfoot { background-color: #f8f9fa; }
        .subtotal-row td { color: #555; border-bottom: 1px dashed #ccc;}
        .total-row td { color: #d32f2f; font-size: 18px; font-weight: bold; background-color: #e9ecef;}

        #loading { text-align: center; font-style: italic; color: #666; margin: 20px 0; font-size: 18px; display: none;}
    </style>
</head>
<body>

    <div id="screenMenu">
        <h2 id="mainAppTitle">Thu diện tích bán hàng tại chợ Phước Hậu điểm 1</h2> 
        <div class="menu-container">
            <button class="menu-btn btn-ds" onclick="loadData('ds')">📋 Danh sách mặt bằng (Mẫu)</button>
            <button class="menu-btn btn-all" onclick="loadData('all')">📑 Danh sách thu</button>
            <button class="menu-btn btn-paid" onclick="loadData('paid')">✅ Danh sách đã đóng</button>
            <button class="menu-btn btn-unpaid" onclick="loadData('unpaid')">⚠️ Danh sách chưa đóng</button>
            <button class="menu-btn btn-action" onclick="loadData('mark_paid')">💳 Cập nhật đóng tiền</button>
        </div>
    </div>

    <div id="screenTable" style="display: none;">
        <div class="top-controls">
            <button class="back-btn" onclick="showMenu()">⬅ Quay lại Menu</button>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Tìm tên, lô, ngành hàng..." onkeyup="renderTable()">
            </div>
        </div>
        
        <h2 id="tableTitle">Danh Sách</h2>
        
        <div id="loading">Đang tải dữ liệu, vui lòng đợi...</div>

        <div class="table-container" id="tableDiv" style="display: none;">
            <table id="dataTable">
                <thead>
                    <tr id="tableHead"></tr>
                </thead>
                <tbody id="tableBody"></tbody>
                <tfoot id="tableFoot"></tfoot>
            </table>
        </div>
    </div>

    <script>
        // === DÁN URL WEB APP CỦA BẠN VÀO ĐÂY ===
        const API_URL = 'https://script.google.com/macros/s/AKfycbybIJG6O7ESHssYwVx6kpQv2QL-5YG4FOKGAKSV1CZ7xiGpfmozDqfpF9uoBwx_jXHn/exec';
        
        let globalData = []; 
        let currentSheetName = ""; 
        let currentViewMode = 'all'; 
        let loadedDataType = ""; 

        function showMenu() {
            document.getElementById('screenMenu').style.display = 'block';
            document.getElementById('screenTable').style.display = 'none';
        }

        function updateTableTitle() {
            const titles = {
                'ds': 'Danh Sách Mặt Bằng (Mẫu)',
                'all': 'Danh Sách Thu',
                'paid': 'Danh Sách Đã Đóng',
                'unpaid': 'Danh Sách Chưa Đóng',
                'mark_paid': 'Chế Độ: Cập Nhật Đóng Tiền'
            };
            let suffix = currentSheetName ? ` (${currentSheetName})` : "";
            document.getElementById('tableTitle').innerText = titles[currentViewMode] + suffix;
        }

        function loadData(viewMode) {
            currentViewMode = viewMode;
            let targetType = (viewMode === 'ds') ? 'ds' : 'current'; 

            document.getElementById('screenMenu').style.display = 'none';
            document.getElementById('screenTable').style.display = 'block';
            document.getElementById('tableDiv').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            
            document.getElementById('searchInput').value = '';

            if(globalData.length > 0 && loadedDataType === targetType) {
                updateTableTitle();
                renderTable();
            } else {
                document.getElementById('tableTitle').innerText = "Đang tải dữ liệu...";
                let fetchUrl = API_URL + "?type=" + targetType;

                fetch(fetchUrl)
                .then(response => response.json())
                .then(res => {
                    if(res.success) {
                        globalData = res.data;
                        currentSheetName = res.sheetName; 
                        loadedDataType = targetType; 
                        updateTableTitle(); 
                        renderTable();
                    } else {
                        document.getElementById('loading').innerText = 'Lỗi từ dữ liệu: ' + res.message;
                    }
                })
                .catch(error => {
                    document.getElementById('loading').innerText = 'Lỗi kết nối dữ liệu!';
                });
            }
        }

        function renderTable() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('tableDiv').style.display = 'block';
            
            let filteredData = globalData;
            let searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

            if(currentViewMode === 'paid') {
                filteredData = globalData.filter(row => String(row['Trạng thái'] || '').trim().toLowerCase() === 'đã đóng');
            } else if(currentViewMode === 'unpaid' || currentViewMode === 'mark_paid') {
                filteredData = globalData.filter(row => String(row['Trạng thái'] || '').trim().toLowerCase() === 'chưa đóng');
            }

            if (searchTerm !== '') {
                filteredData = filteredData.filter(row => {
                    return Object.keys(row).some(key => {
                        if (key === '_rowIndex' || key === '_sheetName') return false; 
                        let cellValue = String(row[key] || '').toLowerCase();
                        return cellValue.includes(searchTerm);
                    });
                });
            }

            if(filteredData.length === 0) {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="15" style="text-align:center; padding: 20px;">Không có dữ liệu</td></tr>';
                document.getElementById('tableHead').innerHTML = '';
                document.getElementById('tableFoot').innerHTML = '';
                return;
            }

            let headers = Object.keys(filteredData[0]).filter(h => h !== '_rowIndex' && h !== '_sheetName');
            let isActionView = (currentViewMode === 'mark_paid' || currentViewMode === 'paid');
            
            let theadHtml = '';
            headers.forEach(header => {
                theadHtml += `<th>${header}</th>`;
            });
            if(isActionView) theadHtml += `<th class="col-action">Thao tác</th>`;
            document.getElementById('tableHead').innerHTML = theadHtml;

            let tbodyHtml = '';
            // Khai báo biến tính tổng tách biệt
            let totalCurrent = 0;
            let totalDebt = 0;
            let amountColumnIndex = -1;
            
            let currentSection = ""; // Biến để theo dõi vách ngăn

            filteredData.forEach(row => {
                // Thêm vách ngăn (Divider) nếu chuyển từ danh sách Tháng sang Nợ
                if (currentViewMode !== 'ds' && currentSection !== row._sheetName) {
                    currentSection = row._sheetName;
                    let colspanTotal = headers.length + (isActionView ? 1 : 0);
                    let sectionTitle = (currentSection === 'Nợ') 
                        ? '⚠️ DANH SÁCH CÔNG NỢ TỪ CÁC THÁNG TRƯỚC' 
                        : `📅 DANH SÁCH PHÁT SINH KỲ NÀY`;
                    tbodyHtml += `<tr class="section-divider"><td colspan="${colspanTotal}">${sectionTitle}</td></tr>`;
                }

                let rowClass = (row._sheetName === 'Nợ') ? 'row-debt' : '';
                tbodyHtml += `<tr class="${rowClass}">`;
                
                headers.forEach((header, index) => {
                    let val = row[header] !== undefined ? row[header] : '';
                    let strVal = String(val).trim().toLowerCase();
                    
                    if (header.toLowerCase().includes('ghi chú')) {
                        tbodyHtml += `<td>
                            <div class="note-container">
                                <span class="note-text" id="note-${row._sheetName}-${row._rowIndex}">${val}</span>
                                <span class="edit-icon" title="Sửa ghi chú" onclick="editNote('${row._sheetName}', ${row._rowIndex})">✏️</span>
                            </div>
                        </td>`;
                    } 
                    else if (header.toLowerCase().includes('trạng thái')) {
                        let statusClass = strVal === 'chưa đóng' ? 'status-unpaid' : (strVal === 'đã đóng' ? 'status-paid' : '');
                        tbodyHtml += `<td><span class="status-badge ${statusClass}">${val}</span></td>`;
                    } else {
                        tbodyHtml += `<td>${val}</td>`;
                    }

                    // Tách biệt tính tổng cho Tháng này và Công nợ
                    if (header.toLowerCase() === 'thành tiền') {
                        amountColumnIndex = index;
                        let num = parseInt(String(val).replace(/\./g, '').replace(/,/g, ''));
                        if(!isNaN(num)) {
                            if (row._sheetName === 'Nợ') {
                                totalDebt += num;
                            } else {
                                totalCurrent += num;
                            }
                        }
                    }
                });
                
                if(currentViewMode === 'mark_paid') {
                    tbodyHtml += `<td class="col-action"><button class="mark-btn" onclick="updateStatus('${row._sheetName}', ${row._rowIndex}, this, 'đã đóng')">Thu tiền</button></td>`;
                } else if (currentViewMode === 'paid') {
                    tbodyHtml += `<td class="col-action"><button class="undo-btn" onclick="updateStatus('${row._sheetName}', ${row._rowIndex}, this, 'chưa đóng')">Hoàn tác</button></td>`;
                }
                
                tbodyHtml += `</tr>`;
            });
            document.getElementById('tableBody').innerHTML = tbodyHtml;

            // Xây dựng Footer Kế toán (Tính tổng 3 cấp)
            if(amountColumnIndex !== -1) {
                let remainingCols = headers.length - amountColumnIndex - 1 + (isActionView ? 1 : 0);
                let emptyCells = remainingCols > 0 ? `<td colspan="${remainingCols}"></td>` : '';
                
                let tfootHtml = ``;
                
                // Chỉ hiển thị báo cáo chi tiết nếu không phải là đang xem mẫu DS
                if (currentViewMode !== 'ds') {
                    tfootHtml += `
                        <tr class="subtotal-row">
                            <td colspan="${amountColumnIndex}" style="text-align: right; font-weight: bold;">TỔNG PHÁT SINH KỲ NÀY:</td>
                            <td style="color: #007bff; font-weight: bold;">${totalCurrent.toLocaleString('vi-VN')}</td>
                            ${emptyCells}
                        </tr>
                        <tr class="subtotal-row">
                            <td colspan="${amountColumnIndex}" style="text-align: right; font-weight: bold;">TỔNG CÔNG NỢ CŨ:</td>
                            <td style="color: #ff9800; font-weight: bold;">${totalDebt.toLocaleString('vi-VN')}</td>
                            ${emptyCells}
                        </tr>
                    `;
                }
                
                // Dòng TỔNG CỘNG cuối cùng
                let grandTotal = (currentViewMode === 'ds') ? totalCurrent : (totalCurrent + totalDebt);
                tfootHtml += `
                    <tr class="total-row">
                        <td colspan="${amountColumnIndex}" style="text-align: right;">TỔNG CỘNG ĐANG HIỂN THỊ:</td>
                        <td>${grandTotal.toLocaleString('vi-VN')}</td>
                        ${emptyCells}
                    </tr>
                `;
                document.getElementById('tableFoot').innerHTML = tfootHtml;
            }
        }

        function editNote(rowSheetName, rowIndex) {
            let rowData = globalData.find(r => r._rowIndex === rowIndex && r._sheetName === rowSheetName);
            let currentNote = rowData['Ghi chú'] !== undefined ? rowData['Ghi chú'] : '';
            
            let newNote = prompt(`Nhập ghi chú mới cho hộ này (Thuộc danh sách ${rowSheetName}):`, currentNote);
            if (newNote === null || newNote === currentNote) return; 

            let noteElement = document.getElementById(`note-${rowSheetName}-${rowIndex}`);
            let oldText = noteElement.innerText;
            noteElement.innerText = "⏳ Đang lưu..."; 

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    sheetName: rowSheetName, 
                    rowIndex: rowIndex,
                    updateType: 'note',
                    value: newNote
                })
            })
            .then(response => response.json())
            .then(res => {
                if(res.success) {
                    rowData['Ghi chú'] = newNote; 
                    renderTable(); 
                } else {
                    alert("❌ Lỗi: " + res.message);
                    noteElement.innerText = oldText; 
                }
            })
            .catch(err => {
                alert("❌ Lỗi kết nối!");
                noteElement.innerText = oldText;
            });
        }

        function updateStatus(rowSheetName, rowIndex, btnElement, newStatus) {
            let confirmMessage = newStatus === 'đã đóng' ? `Xác nhận hộ này ĐÃ ĐÓNG TIỀN?` : `Xác nhận HỦY THU TIỀN hộ này?`;
            if(!confirm(confirmMessage)) return;
            
            let originalText = btnElement.innerText;
            btnElement.innerText = "Đang xử lý...";
            btnElement.disabled = true;

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    sheetName: rowSheetName,
                    rowIndex: rowIndex,
                    updateType: 'status', 
                    value: newStatus
                })
            })
            .then(response => response.json())
            .then(res => {
                if(res.success) {
                    let rowData = globalData.find(r => r._rowIndex === rowIndex && r._sheetName === rowSheetName);
                    if(rowData) rowData['Trạng thái'] = newStatus;
                    renderTable();
                } else {
                    alert("❌ Lỗi: " + res.message);
                    btnElement.innerText = originalText;
                    btnElement.disabled = false;
                }
            })
            .catch(err => {
                alert("❌ Lỗi kết nối!");
                btnElement.innerText = originalText;
                btnElement.disabled = false;
            });
        }
    </script>
</body>
</html>
