<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thu diện tích bán hàng tại chợ Phước Hậu điểm 1</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f8f9fa; margin: 0; }
        h2 { text-align: center; color: #333; margin-bottom: 30px; }
        
        .menu-container { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .menu-btn { padding: 25px 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; color: white; display: flex; align-items: center; justify-content: center; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .menu-btn:hover { transform: translateY(-3px); }
        
        .btn-ds { background-color: #6c757d; grid-column: span 2; } 
        .btn-all { background-color: #007bff; }
        .btn-paid { background-color: #28a745; }
        .btn-unpaid { background-color: #ffc107; color: #333; }
        .btn-closed { background-color: white; color: #333; border: 2px solid #ccc; }
        .btn-action { background-color: #dc3545; grid-column: span 2; padding: 20px; font-size: 18px; }
        .btn-chotso { background-color: #343a40; grid-column: span 2; padding: 15px; margin-top: 15px; font-size: 16px;}

        .table-container { overflow-x: auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: #343a40; color: white; position: sticky; top: 0; z-index: 10; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        tr:hover { background-color: #e9ecef; }
        
        .status-badge { padding: 5px 10px; border-radius: 20px; font-weight: bold; font-size: 12px; display: inline-block; min-width: 80px; text-align: center;}
        .status-unpaid { background-color: #ffeeba; color: #856404; }
        .status-paid { background-color: #d4edda; color: #155724; }
        
        .note-container { display: flex; justify-content: space-between; align-items: center; min-width: 100px; }
        .edit-icon { cursor: pointer; margin-left: 8px; font-size: 14px; opacity: 0.5; transition: 0.2s; }
        .edit-icon:hover { opacity: 1; transform: scale(1.2); }
        .note-text { flex-grow: 1; }
        
        .top-controls { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-bottom: 15px; }
        .back-btn { background-color: #6c757d; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .search-box { flex-grow: 1; max-width: 400px; }
        .search-box input { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 5px; font-size: 15px; box-sizing: border-box; }
        
        .mark-btn { background-color: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        .mark-btn:hover { background-color: #218838; }
        .undo-btn { background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        .undo-btn:hover { background-color: #c82333; }
        .col-action { width: 90px; text-align: center; }
        
        .row-debt td { background-color: #fff3cd !important; } 
        .section-divider td { background-color: #ffffff !important; padding: 15px 10px; text-align: center; font-size: 18px; font-weight: bold; border: none !important; }
        .title-current { color: #333; }
        .title-debt { color: #d32f2f; }
        .subtotal-row td { font-weight: bold; border-top: 2px solid #555; background-color: #ffffff !important; border-bottom: none !important; border-left: none !important; border-right: none !important; }
        .subtotal-debt td { color: #d32f2f; }
        .subtotal-current td { color: #333; }
        
        tfoot { background-color: #e9ecef; }
        .total-row td { color: #007bff; font-size: 18px; font-weight: bold; background-color: #e9ecef; text-align: right; }

        #loading { text-align: center; font-style: italic; color: #666; margin: 20px 0; font-size: 18px; display: none;}
    </style>
</head>
<body>

    <div id="screenMenu">
        <h2 id="mainAppTitle">Thu diện tích bán hàng tại chợ Phước Hậu điểm 1</h2> 
        <div class="menu-container">
            <button class="menu-btn btn-ds" onclick="loadData('ds')">📋 Danh sách mặt bằng</button>
            <button class="menu-btn btn-all" onclick="loadData('all')">📑 Danh sách thu</button>
            <button class="menu-btn btn-paid" onclick="loadData('paid')">✅ Danh sách đã đóng</button>
            <button class="menu-btn btn-unpaid" onclick="loadData('unpaid')">⚠️ Danh sách chưa đóng</button>
            <button class="menu-btn btn-closed" onclick="loadClosedList()">📁 Danh sách đã chốt</button>
            <button class="menu-btn btn-action" onclick="loadData('mark_paid')">💳 Cập nhật đóng tiền</button>
            <button class="menu-btn btn-chotso" onclick="executeChotSo()">🔒 CHỐT SỔ & CHUYỂN KỲ MỚI</button>
        </div>
    </div>

    <div id="screenTable" style="display: none;">
        <div class="top-controls">
            <button class="back-btn" onclick="showMenu()">⬅ Quay lại Menu</button>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Tìm tên, lô, ngành hàng..." onkeyup="renderTable()">
            </div>
        </div>
        
        <h2 id="tableTitle">Danh Sách</h2>
        
        <div id="loading">Đang tải dữ liệu, vui lòng đợi...</div>

        <div class="table-container" id="tableDiv" style="display: none;">
            <table id="dataTable">
                <thead>
                    <tr id="tableHead"></tr>
                </thead>
                <tbody id="tableBody"></tbody>
                <tfoot id="tableFoot"></tfoot>
            </table>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzGtWZv_dp14Ge0EyHJfjHr_VKB0vNjy_7nJ64yuuBf-P3pFplp8F2cafAaoazeg9JM/exec';
        
        let globalData = []; 
        let currentSheetName = ""; 
        let currentViewMode = 'all'; 
        let loadedDataType = ""; 

        function showMenu() {
            document.getElementById('screenMenu').style.display = 'block';
            document.getElementById('screenTable').style.display = 'none';
        }

        function executeChotSo() {
            if(!confirm("⚠️ XÁC NHẬN CHỐT SỔ KỲ NÀY?\n\nHệ thống sẽ tự động:\n1. Gom hộ Đã Đóng (Tháng này + Nợ cũ) vào Sổ Đã Chốt.\n2. Gom hộ Chưa Đóng chuyển toàn bộ sang Sổ Nợ.\n3. Khởi tạo danh sách thu cho kỳ tiếp theo.")) return;

            document.getElementById('screenMenu').style.display = 'none';
            document.getElementById('screenTable').style.display = 'block';
            document.getElementById('tableDiv').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('tableTitle').innerText = "Đang xử lý chốt sổ, vui lòng không tắt trang...";

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ updateType: 'chot_so' })
            })
            .then(r => r.json())
            .then(res => {
                if(res.success) {
                    alert("✅ " + res.message);
                    globalData = []; 
                    loadedDataType = "";
                    loadData('all');
                } else {
                    alert("❌ Lỗi: " + res.message);
                    showMenu();
                }
            })
            .catch(e => { alert("❌ Lỗi kết nối!"); showMenu(); });
        }

        function loadClosedList() {
            currentViewMode = 'closed_list';
            document.getElementById('screenMenu').style.display = 'none';
            document.getElementById('screenTable').style.display = 'block';
            document.getElementById('tableDiv').style.display = 'block';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('tableTitle').innerText = "Danh Sách Đã Chốt";
            document.getElementById('tableBody').innerHTML = '';
            document.getElementById('tableFoot').innerHTML = '';
            document.getElementById('tableHead').innerHTML = '';

            fetch(API_URL + "?type=closed_list")
            .then(r => r.json())
            .then(res => {
                document.getElementById('loading').style.display = 'none';
                if(res.success) {
                    let list = res.data;
                    if(list.length === 0) {
                        document.getElementById('tableBody').innerHTML = '<tr><td colspan="10" style="text-align:center; padding: 20px;">Chưa có kỳ nào được chốt trong hệ thống.</td></tr>';
                    } else {
                        let html = '<tr><td colspan="10" style="text-align:center; padding: 20px;"><h3>Vui lòng chọn kỳ đã chốt để xem:</h3>';
                        list.forEach(name => {
                             html += `<button class="mark-btn" style="margin: 10px; background: #17a2b8; padding: 12px 25px; width: auto;" onclick="loadClosedData('${name}')">📁 ${name.replace('Chốt-', '')}</button>`;
                        });
                        html += '</td></tr>';
                        document.getElementById('tableBody').innerHTML = html;
                    }
                }
            });
        }

        function loadClosedData(sheetName) {
            currentViewMode = 'closed_data';
            document.getElementById('tableDiv').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('tableTitle').innerText = "Đang tải " + sheetName.replace('Chốt-', '') + "...";

            fetch(API_URL + "?type=closed_data&sheetName=" + sheetName)
            .then(r => r.json())
            .then(res => {
                if(res.success) {
                    globalData = res.data;
                    currentSheetName = res.sheetName;
                    document.getElementById('tableTitle').innerText = "Kỳ Đã Chốt: " + currentSheetName.replace('Chốt-', '');
                    renderTable();
                }
            });
        }

        function updateTableTitle() {
            if(currentViewMode === 'closed_list' || currentViewMode === 'closed_data') return; 
            const titles = {
                'ds': 'Danh Sách Mặt Bằng',
                'all': 'Danh Sách Thu',
                'paid': 'Danh Sách Đã Đóng',
                'unpaid': 'Danh Sách Chưa Đóng',
                'mark_paid': 'Chế Độ: Cập Nhật Đóng Tiền'
            };
            let suffix = (currentSheetName && currentViewMode !== 'ds') ? ` (${currentSheetName})` : "";
            document.getElementById('tableTitle').innerText = titles[currentViewMode] + suffix;
        }

        function loadData(viewMode) {
            currentViewMode = viewMode;
            let targetType = (viewMode === 'ds') ? 'ds' : 'current'; 

            document.getElementById('screenMenu').style.display = 'none';
            document.getElementById('screenTable').style.display = 'block';
            document.getElementById('tableDiv').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('searchInput').value = '';

            if(globalData.length > 0 && loadedDataType === targetType) {
                updateTableTitle();
                renderTable();
            } else {
                document.getElementById('tableTitle').innerText = "Đang tải dữ liệu...";
                let fetchUrl = API_URL + "?type=" + targetType;

                fetch(fetchUrl)
                .then(response => response.json())
                .then(res => {
                    if(res.success) {
                        globalData = res.data;
                        currentSheetName = res.sheetName; 
                        loadedDataType = targetType; 
                        updateTableTitle(); 
                        renderTable();
                    } else {
                        document.getElementById('loading').innerText = 'Lỗi từ dữ liệu: ' + res.message;
                    }
                })
                .catch(error => {
                    document.getElementById('loading').innerText = 'Lỗi kết nối dữ liệu! Vui lòng thử lại.';
                });
            }
        }

        function renderTable() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('tableDiv').style.display = 'block';
            
            let filteredData = globalData;
            let searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

            if(currentViewMode === 'paid') {
                filteredData = globalData.filter(row => String(row['Trạng thái'] || '').trim().toLowerCase() === 'đã đóng');
            } else if(currentViewMode === 'unpaid' || currentViewMode === 'mark_paid') {
                filteredData = globalData.filter(row => String(row['Trạng thái'] || '').trim().toLowerCase() === 'chưa đóng');
            }

            if (searchTerm !== '') {
                filteredData = filteredData.filter(row => {
                    return Object.keys(row).some(key => {
                        if (key === '_rowIndex' || key === '_sheetName') return false; 
                        let cellValue = String(row[key] || '').toLowerCase();
                        return cellValue.includes(searchTerm);
                    });
                });
            }

            if(filteredData.length === 0) {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="15" style="text-align:center; padding: 20px;">Không có dữ liệu</td></tr>';
                document.getElementById('tableHead').innerHTML = '';
                document.getElementById('tableFoot').innerHTML = '';
                return;
            }

            let headers = Object.keys(filteredData[0]).filter(h => h !== '_rowIndex' && h !== '_sheetName');
            let isActionView = (currentViewMode === 'mark_paid' || currentViewMode === 'paid');
            
            let theadHtml = '';
            headers.forEach(header => { theadHtml += `<th>${header}</th>`; });
            if(isActionView) theadHtml += `<th class="col-action">Thao tác</th>`;
            document.getElementById('tableHead').innerHTML = theadHtml;

            let currentDataList = [];
            let debtGroups = {}; 
            let totalCurrent = 0;
            let totalDebt = 0;
            let amountColumnIndex = -1;

            // Xử lý Bóc Tách Tên Tháng/Năm cho cả Danh Sách Hiện Tại & Danh Sách Đã Chốt
            let extractedMonth = "Hiện tại";
            let extractedYear = "";
            let baseName = currentSheetName.replace('Chốt-', ''); // Loại bỏ chữ Chốt nếu có
            if(baseName.includes('T') && baseName !== 'DS') {
                let p = baseName.split(' ')[0].replace('T', '').split('-');
                if(p.length > 1) {
                    extractedMonth = p[0];
                    extractedYear = "20" + p[1];
                }
            }

            filteredData.forEach(row => {
                if (currentViewMode === 'ds') {
                    currentDataList.push(row);
                } 
                else if (currentViewMode === 'closed_data') {
                    // CƠ CHẾ BÓC TÁCH CHO SỔ ĐÃ CHỐT DỰA VÀO CỘT THÁNG/NĂM
                    let m = String(row['Tháng'] || '').trim();
                    let y = String(row['Năm'] || '').trim();
                    
                    if (m === extractedMonth && y === extractedYear) {
                        currentDataList.push(row);
                    } else {
                        let key = `T${m}-${y}`;
                        if(!debtGroups[key]) debtGroups[key] = { month: m, year: y, rows: [] };
                        debtGroups[key].rows.push(row);
                    }
                }
                else { 
                    if (row._sheetName.includes('T')) {
                        currentDataList.push(row);
                    } else if (row._sheetName === 'Nợ') {
                        let m = row['Tháng'] || '?';
                        let y = row['Năm'] || '?';
                        let key = `T${m}-${y}`;
                        if(!debtGroups[key]) debtGroups[key] = { month: m, year: y, rows: [] };
                        debtGroups[key].rows.push(row);
                    }
                }
            });

            let tbodyHtml = '';
            let totalColumns = headers.length + (isActionView ? 1 : 0);

            function renderRowGroup(rows, titleText, isDebt, debtMonth, debtYear) {
                let groupTotal = 0;
                let titleClass = isDebt ? 'title-debt' : 'title-current';
                let rowClass = isDebt ? 'row-debt' : '';
                let subtotalClass = isDebt ? 'subtotal-debt' : 'subtotal-current';
                
                if (titleText !== "") {
                    tbodyHtml += `<tr class="section-divider ${titleClass}"><td colspan="${totalColumns}">${titleText}</td></tr>`;
                }

                rows.forEach(row => {
                    tbodyHtml += `<tr class="${rowClass}">`;
                    headers.forEach((header, index) => {
                        let val = row[header] !== undefined ? row[header] : '';
                        let strVal = String(val).trim().toLowerCase();
                        
                        // Khóa chức năng Edit ghi chú nếu đang xem Sổ Chốt
                        let isClosed = (currentViewMode === 'closed_data');
                        
                        if (header.toLowerCase().includes('ghi chú')) {
                            tbodyHtml += `<td>
                                <div class="note-container">
                                    <span class="note-text" id="note-${row._sheetName}-${row._rowIndex}">${val}</span>
                                    ${!isClosed ? `<span class="edit-icon" title="Sửa ghi chú" onclick="editNote('${row._sheetName}', ${row._rowIndex})">✏️</span>` : ''}
                                </div>
                            </td>`;
                        } 
                        else if (header.toLowerCase().includes('trạng thái')) {
                            let statusClass = strVal === 'chưa đóng' ? 'status-unpaid' : (strVal === 'đã đóng' ? 'status-paid' : '');
                            tbodyHtml += `<td><span class="status-badge ${statusClass}">${val}</span></td>`;
                        } else {
                            tbodyHtml += `<td>${val}</td>`;
                        }

                        if (header.toLowerCase() === 'thành tiền') {
                            amountColumnIndex = index;
                            let num = parseInt(String(val).replace(/\./g, '').replace(/,/g, ''));
                            if(!isNaN(num)) {
                                groupTotal += num;
                                if(isDebt) totalDebt += num;
                                else totalCurrent += num;
                            }
                        }
                    });
                    
                    if(currentViewMode === 'mark_paid') {
                        tbodyHtml += `<td class="col-action"><button class="mark-btn" onclick="updateStatus('${row._sheetName}', ${row._rowIndex}, this, 'đã đóng')">Thu tiền</button></td>`;
                    } else if (currentViewMode === 'paid') {
                        tbodyHtml += `<td class="col-action"><button class="undo-btn" onclick="updateStatus('${row._sheetName}', ${row._rowIndex}, this, 'chưa đóng')">Hoàn tác</button></td>`;
                    }
                    tbodyHtml += `</tr>`;
                });

                if (currentViewMode !== 'ds' && titleText !== "") {
                    let subTotalText = isDebt ? `Tổng nợ tháng ${debtMonth} năm ${debtYear}` : `Tổng tháng ${extractedMonth} năm ${extractedYear}`;
                    tbodyHtml += `
                    <tr class="subtotal-row ${subtotalClass}">
                        <td colspan="${amountColumnIndex}" style="text-align: right;">${subTotalText}</td>
                        <td>${groupTotal.toLocaleString('vi-VN')}</td>
                        <td colspan="${headers.length - amountColumnIndex - 1 + (isActionView ? 1 : 0)}"></td>
                    </tr>`;
                }
            }

            // 1. Nhóm Tháng chính (Áp dụng cho cả Danh sách thu và Danh sách Chốt)
            if (currentDataList.length > 0) {
                let currentTitle = (currentViewMode === 'ds') ? "" : `Tháng ${extractedMonth} năm ${extractedYear}`;
                renderRowGroup(currentDataList, currentTitle, false, null, null);
            }

            // 2. Nhóm Nợ cũ
            let debtKeys = Object.keys(debtGroups);
            if (debtKeys.length > 0) {
                tbodyHtml += `<tr class="section-divider title-debt"><td colspan="${totalColumns}">Nợ</td></tr>`;
                
                debtKeys.sort((a, b) => {
                    let ya = parseInt(debtGroups[a].year) || 0;
                    let yb = parseInt(debtGroups[b].year) || 0;
                    if (ya !== yb) return ya - yb;
                    return (parseInt(debtGroups[a].month) || 0) - (parseInt(debtGroups[b].month) || 0);
                });

                debtKeys.forEach(key => {
                    let group = debtGroups[key];
                    renderRowGroup(group.rows, `Nợ tháng ${group.month} năm ${group.year}`, true, group.month, group.year);
                });

                tbodyHtml += `
                <tr class="subtotal-row title-debt" style="font-size: 16px;">
                    <td colspan="${amountColumnIndex}" style="text-align: right;">Tổng Nợ:</td>
                    <td>${totalDebt.toLocaleString('vi-VN')}</td>
                    <td colspan="${headers.length - amountColumnIndex - 1 + (isActionView ? 1 : 0)}"></td>
                </tr>`;
            }

            document.getElementById('tableBody').innerHTML = tbodyHtml;

            // Bảng tổng cộng cuối cùng
            if(amountColumnIndex !== -1) {
                let remainingCols = headers.length - amountColumnIndex - 1 + (isActionView ? 1 : 0);
                let emptyCells = remainingCols > 0 ? `<td colspan="${remainingCols}"></td>` : '';
                
                if (currentViewMode === 'ds') {
                    document.getElementById('tableFoot').innerHTML = `
                        <tr class="total-row">
                            <td colspan="${amountColumnIndex}" style="text-align: right;">TỔNG CỘNG:</td>
                            <td>${totalCurrent.toLocaleString('vi-VN')}</td>
                            ${emptyCells}
                        </tr>`;
                } else {
                    let grandTotal = totalCurrent + totalDebt;
                    document.getElementById('tableFoot').innerHTML = `
                        <tr class="total-row">
                            <td colspan="${amountColumnIndex}" style="text-align: right;">TỔNG CỘNG THU:</td>
                            <td>${grandTotal.toLocaleString('vi-VN')}</td>
                            ${emptyCells}
                        </tr>`;
                }
            } else {
                 document.getElementById('tableFoot').innerHTML = ''; 
            }
        }

        function editNote(rowSheetName, rowIndex) {
            let rowData = globalData.find(r => r._rowIndex === rowIndex && r._sheetName === rowSheetName);
            let currentNote = rowData['Ghi chú'] !== undefined ? rowData['Ghi chú'] : '';
            
            let newNote = prompt(`Nhập ghi chú mới cho hộ này:`, currentNote);
            if (newNote === null || newNote === currentNote) return; 

            let noteElement = document.getElementById(`note-${rowSheetName}-${rowIndex}`);
            let oldText = noteElement.innerText;
            noteElement.innerText = "⏳..."; 

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    sheetName: rowSheetName, 
                    rowIndex: rowIndex,
                    updateType: 'note',
                    value: newNote
                })
            })
            .then(r => r.json())
            .then(res => {
                if(res.success) {
                    rowData['Ghi chú'] = newNote; 
                    renderTable(); 
                } else {
                    alert("❌ Lỗi: " + res.message);
                    noteElement.innerText = oldText; 
                }
            })
            .catch(err => { alert("❌ Lỗi kết nối!"); noteElement.innerText = oldText; });
        }

        function updateStatus(rowSheetName, rowIndex, btnElement, newStatus) {
            let confirmMessage = newStatus === 'đã đóng' ? `Xác nhận hộ này ĐÃ ĐÓNG TIỀN?` : `Xác nhận HỦY THU TIỀN hộ này?`;
            if(!confirm(confirmMessage)) return;
            
            let originalText = btnElement.innerText;
            btnElement.innerText = "Đang xử lý...";
            btnElement.disabled = true;

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    sheetName: rowSheetName,
                    rowIndex: rowIndex,
                    updateType: 'status', 
                    value: newStatus
                })
            })
            .then(r => r.json())
            .then(res => {
                if(res.success) {
                    let rowData = globalData.find(r => r._rowIndex === rowIndex && r._sheetName === rowSheetName);
                    if(rowData) rowData['Trạng thái'] = newStatus;
                    renderTable();
                } else {
                    alert("❌ Lỗi: " + res.message);
                    btnElement.innerText = originalText;
                    btnElement.disabled = false;
                }
            })
            .catch(err => { alert("❌ Lỗi kết nối!"); btnElement.innerText = originalText; btnElement.disabled = false; });
        }
    </script>
</body>
