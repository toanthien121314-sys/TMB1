<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thu diện tích bán hàng tại chợ Phước Hậu điểm 1</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f8f9fa; margin: 0; }
        h2 { text-align: center; color: #333; margin-bottom: 30px; }
        
        .menu-container { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .menu-btn { padding: 25px 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; color: white; display: flex; align-items: center; justify-content: center; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .menu-btn:hover { transform: translateY(-3px); }
        
        .btn-ds { background-color: #6c757d; grid-column: span 2; } 
        .btn-all { background-color: #007bff; }
        .btn-paid { background-color: #28a745; }
        .btn-unpaid { background-color: #ffc107; color: #333; }
        .btn-closed { background-color: white; color: #333; border: 2px solid #ccc; }
        .btn-action { background-color: #dc3545; grid-column: span 2; padding: 20px; font-size: 18px; }
        .btn-chotso { background-color: #343a40; grid-column: span 2; padding: 15px; margin-top: 15px; font-size: 16px;}
        .btn-rep { background-color: #6f42c1; grid-column: span 2; padding: 15px; margin-top: 5px; font-size: 16px; }

        .table-container { overflow-x: auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: #343a40; color: white; position: sticky; top: 0; z-index: 10; }
        
        tr:nth-child(even) td.normal-cell { background-color: #f2f2f2; transition: background-color 0.2s; }
        tr:nth-child(odd) td.normal-cell { transition: background-color 0.2s; }
        tr.normal-row:hover td.normal-cell { background-color: #e9ecef !important; }
        
        .status-badge { padding: 5px 10px; border-radius: 20px; font-weight: bold; font-size: 12px; display: inline-block; min-width: 80px; text-align: center;}
        .status-unpaid { background-color: #ffeeba; color: #856404; }
        .status-paid { background-color: #d4edda; color: #155724; }
        
        .note-container { display: flex; justify-content: space-between; align-items: center; min-width: 100px; }
        .edit-icon { cursor: pointer; margin-left: 8px; font-size: 14px; opacity: 0.5; transition: 0.2s; color: #007bff; }
        .edit-icon:hover { opacity: 1; transform: scale(1.3); }
        .note-text { flex-grow: 1; }
        
        .top-controls { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-bottom: 15px; }
        .back-btn { background-color: #6c757d; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .search-box { flex-grow: 1; max-width: 400px; }
        .search-box input { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 5px; font-size: 15px; box-sizing: border-box; }
        
        .mark-btn { background-color: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; margin-bottom: 3px;}
        .mark-btn:hover { background-color: #218838; }
        .undo-btn { background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; margin-bottom: 3px;}
        .undo-btn:hover { background-color: #c82333; }
        .col-action { width: 90px; text-align: center; }
        
        .row-success td { background-color: #e8f5e9 !important; transition: background-color 0.5s ease; }
        .row-debt td.normal-cell { background-color: #fff3cd !important; transition: background-color 0.2s; } 
        .row-debt:hover td.normal-cell { background-color: #ffe69c !important; } 
        
        .section-divider td { background-color: #ffffff !important; padding: 15px 10px; text-align: center; font-size: 18px; font-weight: bold; border: none !important; }
        .title-current { color: #333; }
        .title-debt { color: #d32f2f; }
        .subtotal-row td { font-weight: bold; border-top: 2px solid #555; background-color: #ffffff !important; border-bottom: none !important; border-left: none !important; border-right: none !important; }
        .subtotal-debt td { color: #d32f2f; }
        .subtotal-current td { color: #333; }
        
        tfoot { background-color: #e9ecef; }
        .total-row td { color: #007bff; font-size: 18px; font-weight: bold; background-color: #e9ecef; text-align: right; }

        #loading { text-align: center; font-style: italic; color: #666; margin: 20px 0; font-size: 18px; display: none;}
    </style>
</head>
<body>

    <div id="screenMenu">
        <h2 id="mainAppTitle">Thu diện tích bán hàng tại chợ Phước Hậu điểm 1</h2> 
        <div class="menu-container">
            <button class="menu-btn btn-ds" onclick="loadData('ds')">📋 Danh sách mặt bằng</button>
            <button class="menu-btn btn-all" onclick="loadData('all')">📑 Danh sách thu</button>
            <button class="menu-btn btn-paid" onclick="loadData('paid')">✅ Xem đã đóng</button>
            <button class="menu-btn btn-unpaid" onclick="loadData('unpaid')">⚠️ Xem chưa đóng</button>
            <button class="menu-btn btn-closed" onclick="loadClosedList()">📁 Danh sách đã chốt</button>
            <button class="menu-btn btn-action" onclick="loadData('mark_paid')">💳 Đóng tiền</button>
            <button class="menu-btn btn-rep" onclick="loadRepSearch()">🔍 Tra cứu theo Đại diện</button>
            <button class="menu-btn btn-chotso" onclick="executeChotSo()">🔒 CHỐT SỔ & CHUYỂN KỲ MỚI</button>
        </div>
    </div>

    <div id="screenTable" style="display: none;">
        <div class="top-controls">
            <button class="back-btn" onclick="showMenu()">⬅ Quay lại Menu</button>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Tìm tên, lô, ngành hàng..." onkeyup="renderTable()">
            </div>
        </div>
        
        <h2 id="tableTitle">Danh Sách</h2>
        
        <div id="loading">Đang tải dữ liệu, vui lòng đợi...</div>

        <div class="table-container" id="tableDiv" style="display: none;">
            <table id="dataTable">
                <thead>
                    <tr id="tableHead"></tr>
                </thead>
                <tbody id="tableBody"></tbody>
                <tfoot id="tableFoot"></tfoot>
            </table>
        </div>
    </div>

    <script>
        // === DÁN URL WEB APP CỦA BẠN VÀO ĐÂY ===
        const API_URL = 'https://script.google.com/macros/s/AKfycby924cOXYdyW85RL9fNiSUwLEM3CFm9jLQsg5ITpjqNR980WMG-1AvCv-_YXKe-TXvm/exec';
        
        let globalData = []; 
        let currentSheetName = ""; 
        let currentViewMode = 'all'; 
        let loadedDataType = ""; 

        function formatCurrencyInput(inputElement) {
            let val = inputElement.value.replace(/[^0-9]/g, '');
            inputElement.value = val.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        }

        function showMenu() {
            document.getElementById('screenMenu').style.display = 'block';
            document.getElementById('screenTable').style.display = 'none';
        }

        function executeChotSo() {
            Swal.fire({
                title: '⚠️ XÁC NHẬN CHỐT SỔ',
                html: "<div style='text-align:left; font-size:15px; margin-top:10px;'>" +
                      "Hệ thống sẽ tự động thực hiện:<br><br>" +
                      "<b>1.</b> Gom hộ Đã Đóng vào File lưu trữ tại thư mục 'Chốt sổ'.<br>" +
                      "<b>2.</b> Gom hộ Chưa Đóng chuyển toàn bộ sang Sổ Nợ.<br>" +
                      "<b>3.</b> Khởi tạo danh sách thu cho kỳ tiếp theo.</div>",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#343a40',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Tiến hành Chốt Sổ',
                cancelButtonText: 'Hủy bỏ'
            }).then((result) => {
                if (result.isConfirmed) {
                    document.getElementById('screenMenu').style.display = 'none';
                    document.getElementById('screenTable').style.display = 'block';
                    document.getElementById('tableDiv').style.display = 'none';
                    document.getElementById('loading').style.display = 'block';
                    document.getElementById('tableTitle').innerText = "Đang xử lý...";

                    Swal.fire({ 
                        title: 'Đang tạo File Lưu trữ', 
                        text: 'Vui lòng không tắt trang web lúc này...', 
                        allowOutsideClick: false, 
                        didOpen: () => { 
                            Swal.showLoading(); 
                        } 
                    });

                    fetch(API_URL, { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                        body: JSON.stringify({ updateType: 'chot_so' }) 
                    })
                    .then(r => r.json())
                    .then(res => {
                        if(res.success) {
                            Swal.fire({ 
                                title: 'Thành công!', 
                                text: res.message, 
                                icon: 'success', 
                                confirmButtonText: 'Đã hiểu' 
                            }).then(() => { 
                                globalData = []; 
                                loadedDataType = ""; 
                                loadData('all'); 
                            });
                        } else {
                            Swal.fire('Lỗi hệ thống!', res.message, 'error');
                            showMenu();
                        }
                    })
                    .catch(e => { 
                        Swal.fire('Lỗi kết nối!', 'Vui lòng kiểm tra lại mạng internet.', 'error'); 
                        showMenu(); 
                    });
                }
            });
        }

        function loadClosedList() {
            currentViewMode = 'closed_list';
            document.getElementById('screenMenu').style.display = 'none';
            document.getElementById('screenTable').style.display = 'block';
            document.getElementById('tableDiv').style.display = 'block';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('tableTitle').innerText = "Danh Sách Đã Chốt";
            document.getElementById('tableBody').innerHTML = '';
            document.getElementById('tableFoot').innerHTML = '';
            document.getElementById('tableHead').innerHTML = '';

            fetch(API_URL + "?type=closed_list")
            .then(r => r.json())
            .then(res => {
                document.getElementById('loading').style.display = 'none';
                if(res.success) {
                    let list = res.data;
                    if(list.length === 0) {
                        document.getElementById('tableBody').innerHTML = '<tr><td colspan="10" style="text-align:center; padding: 20px;">Chưa có kỳ nào được chốt trong hệ thống.</td></tr>';
                    } else {
                        let html = '<tr><td colspan="10" style="text-align:center; padding: 20px;"><h3>Vui lòng chọn kỳ đã chốt để xem:</h3>';
                        list.forEach(item => {
                             html += `<button class="mark-btn" style="margin: 10px; background: #17a2b8; padding: 12px 25px; width: auto;" onclick="loadClosedData('${item.id}', '${item.name}')">📁 ${item.name.replace('Chốt-', '')}</button>`;
                        });
                        html += '</td></tr>';
                        document.getElementById('tableBody').innerHTML = html;
                    }
                }
            });
        }

        function loadClosedData(fileId, fileName) {
            currentViewMode = 'closed_data';
            document.getElementById('tableDiv').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('tableTitle').innerText = "Đang tải " + fileName.replace('Chốt-', '') + "...";

            fetch(API_URL + "?type=closed_data&fileId=" + fileId + "&fileName=" + fileName)
            .then(r => r.json())
            .then(res => {
                if(res.success) {
                    globalData = res.data;
                    currentSheetName = res.sheetName;
                    document.getElementById('tableTitle').innerText = "Kỳ Đã Chốt: " + currentSheetName.replace('Chốt-', '');
                    renderTable();
                }
            });
        }
        
        function loadRepSearch() {
            currentViewMode = 'rep_search';
            let targetType = 'current'; 
            
            document.getElementById('screenMenu').style.display = 'none';
            document.getElementById('screenTable').style.display = 'block';
            document.getElementById('tableDiv').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('searchInput').value = '';
            
            if(globalData.length > 0 && loadedDataType === targetType) {
                updateTableTitle();
                renderTable();
            } else {
                document.getElementById('tableTitle').innerText = "Đang tải dữ liệu...";
                fetch(API_URL + "?type=" + targetType)
                .then(response => response.json())
                .then(res => {
                    if(res.success) {
                        globalData = res.data;
                        currentSheetName = res.sheetName; 
                        loadedDataType = targetType; 
                        updateTableTitle(); 
                        renderTable();
                    } else {
                        document.getElementById('loading').innerText = 'Lỗi từ dữ liệu: ' + res.message;
                    }
                })
                .catch(error => { 
                    document.getElementById('loading').innerText = 'Lỗi kết nối dữ liệu!'; 
                });
            }
        }

        function updateTableTitle() {
            if(currentViewMode === 'closed_list' || currentViewMode === 'closed_data') {
                return; 
            }
            const titles = {
                'ds': 'Danh Sách Mặt Bằng',
                'all': 'Danh Sách Thu',
                'paid': 'Danh Sách Đã Đóng',
                'unpaid': 'Danh Sách Chưa Đóng',
                'mark_paid': 'Chế Độ: Cập Nhật Đóng Tiền',
                'rep_search': 'Tra Cứu Theo Đại Diện' 
            };
            let suffix = (currentSheetName && currentViewMode !== 'ds' && currentViewMode !== 'rep_search') ? ` (${currentSheetName})` : "";
            document.getElementById('tableTitle').innerText = titles[currentViewMode] + suffix;
        }

        function loadData(viewMode) {
            currentViewMode = viewMode;
            let targetType = (viewMode === 'ds') ? 'ds' : 'current'; 

            document.getElementById('screenMenu').style.display = 'none';
            document.getElementById('screenTable').style.display = 'block';
            document.getElementById('tableDiv').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('searchInput').value = '';

            if(globalData.length > 0 && loadedDataType === targetType) {
                updateTableTitle();
                renderTable();
            } else {
                document.getElementById('tableTitle').innerText = "Đang tải dữ liệu...";
                fetch(API_URL + "?type=" + targetType)
                .then(response => response.json())
                .then(res => {
                    if(res.success) {
                        globalData = res.data;
                        currentSheetName = res.sheetName; 
                        loadedDataType = targetType; 
                        updateTableTitle(); 
                        renderTable();
                    } else {
                        document.getElementById('loading').innerText = 'Lỗi từ dữ liệu: ' + res.message;
                    }
                })
                .catch(error => { 
                    document.getElementById('loading').innerText = 'Lỗi kết nối dữ liệu!'; 
                });
            }
        }

        function renderTable() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('tableDiv').style.display = 'block';
            
            let filteredData = globalData;
            let searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

            if(currentViewMode === 'paid') {
                filteredData = globalData.filter(row => String(row['Trạng thái'] || '').trim().toLowerCase() === 'đã đóng');
            } else if(currentViewMode === 'unpaid' || currentViewMode === 'mark_paid') {
                filteredData = globalData.filter(row => String(row['Trạng thái'] || '').trim().toLowerCase() === 'chưa đóng');
            } else if(currentViewMode === 'rep_search') {
                filteredData = filteredData.filter(row => row._daiDien && row._daiDien.trim() !== '');
            }

            if (searchTerm !== '') {
                filteredData = filteredData.filter(row => {
                    return Object.keys(row).some(key => {
                        if (key === '_rowIndex' || key === '_sheetName') {
                            return false; 
                        }
                        let cellValue = String(row[key] || '').toLowerCase();
                        return cellValue.includes(searchTerm);
                    });
                });
            }

            if(filteredData.length === 0) {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="15" style="text-align:center; padding: 20px;">Không có dữ liệu</td></tr>';
                document.getElementById('tableHead').innerHTML = '';
                document.getElementById('tableFoot').innerHTML = '';
                return;
            }

            let headers = Object.keys(filteredData[0]).filter(h => h !== '_rowIndex' && h !== '_sheetName' && h !== '_daiDien' && h.trim().toLowerCase() !== 'đại diện');
            
            if (currentViewMode === 'ds') {
                headers = headers.filter(h => !h.toLowerCase().includes('trạng thái'));
            }

            let isActionView = (currentViewMode === 'mark_paid' || currentViewMode === 'paid' || currentViewMode === 'all' || currentViewMode === 'rep_search');
            
            let theadHtml = '';
            if (currentViewMode === 'ds') {
                theadHtml += `<th class="col-action">Sửa</th>`;
            }

            headers.forEach(header => { 
                theadHtml += `<th>${header}</th>`; 
            });
            
            if (isActionView) {
                theadHtml += `<th class="col-action">Thao tác</th>`;
            }
            document.getElementById('tableHead').innerHTML = theadHtml;

            let totalCurrent = 0;
            let totalDebt = 0;
            let amountColumnIndex = -1;
            let totalColumns = headers.length + (isActionView ? 1 : 0) + (currentViewMode === 'ds' ? 1 : 0);
            let tbodyHtml = '';

            // ========================================================
            // CHẾ ĐỘ 1: RENDER KIỂU MỚI DÀNH RIÊNG CHO "TRA CỨU ĐẠI DIỆN"
            // ========================================================
            if (currentViewMode === 'rep_search') {
                let repGroups = {};
                filteredData.forEach(row => {
                    let rep = row._daiDien.trim();
                    if(!repGroups[rep]) {
                        repGroups[rep] = [];
                    }
                    repGroups[rep].push(row);
                });

                let colorPalette = ['#e8f4f8', '#fff4e6', '#fbe4e4', '#e6f4ea', '#f4e6f4', '#fdf7e3'];
                let colorIdx = 0;

                for (let repName in repGroups) {
                    let rows = repGroups[repName];
                    let blockColor = colorPalette[colorIdx % colorPalette.length];
                    colorIdx++;

                    tbodyHtml += `<tr class="section-divider"><td colspan="${totalColumns}" style="background-color: #343a40 !important; color: #ffeb3b; text-align: left; padding-left: 20px;">👤 Hộ Kinh Doanh: ${repName.toUpperCase()}</td></tr>`;

                    let groupTotal = 0;

                    rows.forEach(row => {
                        tbodyHtml += `<tr class="normal-row">`;
                        headers.forEach((header, index) => {
                            let val = row[header] !== undefined ? row[header] : '';
                            let strVal = String(val).trim().toLowerCase();
                            
                            if (header.toLowerCase().includes('ghi chú')) {
                                tbodyHtml += `<td style="background-color: ${blockColor} !important;">
                                    <div class="note-container">
                                        <span class="note-text" id="note-${row._sheetName}-${row._rowIndex}">${val}</span>
                                        <span class="edit-icon" title="Sửa ghi chú" onclick="editNote('${row._sheetName}', ${row._rowIndex})">✏️</span>
                                    </div>
                                </td>`;
                            } 
                            else if (header.toLowerCase().includes('trạng thái')) {
                                let statusClass = strVal === 'chưa đóng' ? 'status-unpaid' : (strVal === 'đã đóng' ? 'status-paid' : '');
                                tbodyHtml += `<td style="background-color: ${blockColor} !important;"><span class="status-badge ${statusClass}">${val}</span></td>`;
                            } else {
                                if (header.toLowerCase() === 'tháng') {
                                     let isOldDebt = row._sheetName === 'Nợ';
                                     let lbl = isOldDebt ? `<span style="color:#d32f2f; font-weight:bold;">Nợ T${val}</span>` : `T${val}`;
                                     tbodyHtml += `<td style="background-color: ${blockColor} !important;">${lbl}</td>`;
                                } else {
                                     tbodyHtml += `<td style="background-color: ${blockColor} !important;">${val}</td>`;
                                }
                            }

                            if (header.toLowerCase() === 'thành tiền') {
                                amountColumnIndex = index;
                                let num = parseInt(String(val).replace(/\./g, '').replace(/,/g, ''));
                                if(!isNaN(num)) {
                                    groupTotal += num;
                                    totalCurrent += num; 
                                }
                            }
                        });
                        
                        let rowStatus = String(row['Trạng thái'] || row['Trạng Thái'] || '').trim().toLowerCase();
                        let isPaid = (rowStatus === 'đã đóng');
                        let actionBtnClass = isPaid ? 'undo-btn' : 'mark-btn';
                        let actionBtnText = isPaid ? 'Hoàn tác' : 'Đóng tiền';
                        let actionTarget = isPaid ? 'chưa đóng' : 'đã đóng';

                        tbodyHtml += `<td class="col-action" style="background-color: ${blockColor} !important;">
                             <button class="mark-btn" style="background-color: #17a2b8; min-width: 90px; margin-bottom: 5px;" onclick="applyDiscount('${row._sheetName}', ${row._rowIndex})">Miễn/Giảm</button><br>
                             <button class="${actionBtnClass}" onclick="updateStatus('${row._sheetName}', ${row._rowIndex}, this, '${actionTarget}')">${actionBtnText}</button>
                        </td>`;
                        tbodyHtml += `</tr>`;
                    });

                    tbodyHtml += `
                    <tr>
                        <td colspan="${amountColumnIndex}" style="text-align: right; background-color: ${blockColor} !important; border-bottom: 3px solid #ccc; font-weight: bold; color: #333;">TỔNG THU CỦA ${repName.toUpperCase()}:</td>
                        <td style="font-weight: bold; background-color: ${blockColor} !important; border-bottom: 3px solid #ccc; color: #d32f2f; font-size: 16px;">${groupTotal.toLocaleString('vi-VN')}</td>
                        <td colspan="${headers.length - amountColumnIndex - 1 + (isActionView ? 1 : 0)}" style="background-color: ${blockColor} !important; border-bottom: 3px solid #ccc;"></td>
                    </tr>`;
                }
            } 
            // ========================================================
            // CHẾ ĐỘ 2: RENDER CÁC DANH SÁCH BÌNH THƯỜNG
            // ========================================================
            else {
                let currentDataList = [];
                let debtGroups = {}; 
                let extractedMonth = "Hiện tại";
                let extractedYear = "";
                let baseName = currentSheetName.replace('Chốt-', ''); 
                if(baseName.includes('T') && baseName !== 'DS') {
                    let p = baseName.split(' ')[0].replace('T', '').split('-');
                    if(p.length > 1) { 
                        extractedMonth = p[0]; 
                        extractedYear = "20" + p[1]; 
                    }
                }

                filteredData.forEach(row => {
                    if (currentViewMode === 'ds') { 
                        currentDataList.push(row); 
                    } 
                    else if (currentViewMode === 'closed_data') {
                        let m = String(row['Tháng'] || '').trim();
                        let y = String(row['Năm'] || '').trim();
                        if (m === extractedMonth && y === extractedYear) { 
                            currentDataList.push(row); 
                        } 
                        else {
                            let key = `T${m}-${y}`;
                            if(!debtGroups[key]) {
                                debtGroups[key] = { month: m, year: y, rows: [] };
                            }
                            debtGroups[key].rows.push(row);
                        }
                    }
                    else { 
                        if (row._sheetName.includes('T')) { 
                            currentDataList.push(row); 
                        } 
                        else if (row._sheetName === 'Nợ') {
                            let m = row['Tháng'] || '?';
                            let y = row['Năm'] || '?';
                            let key = `T${m}-${y}`;
                            if(!debtGroups[key]) {
                                debtGroups[key] = { month: m, year: y, rows: [] };
                            }
                            debtGroups[key].rows.push(row);
                        }
                    }
                });

                function renderRowGroup(rows, titleText, isDebt, debtMonth, debtYear) {
                    let groupTotal = 0;
                    let titleClass = isDebt ? 'title-debt' : 'title-current';
                    let rowClass = isDebt ? 'row-debt' : 'normal-row';
                    let subtotalClass = isDebt ? 'subtotal-debt' : 'subtotal-current';
                    
                    if (titleText !== "") {
                        tbodyHtml += `<tr class="section-divider ${titleClass}"><td colspan="${totalColumns}">${titleText}</td></tr>`;
                    }

                    rows.forEach(row => {
                        tbodyHtml += `<tr class="${rowClass}">`;
                        
                        if (currentViewMode === 'ds') {
                            tbodyHtml += `<td class="col-action normal-cell">
                                <span class="edit-icon" title="Chỉnh sửa dòng này" onclick="editRowInfo('${row._sheetName}', ${row._rowIndex})" style="font-size: 18px;">✏️</span>
                            </td>`;
                        }

                        headers.forEach((header, index) => {
                            let val = row[header] !== undefined ? row[header] : '';
                            let strVal = String(val).trim().toLowerCase();
                            let isClosed = (currentViewMode === 'closed_data');
                            
                            if (currentViewMode === 'ds') {
                                tbodyHtml += `<td class="normal-cell">${val}</td>`;
                            } else {
                                if (header.toLowerCase().includes('ghi chú')) {
                                    tbodyHtml += `<td class="normal-cell">
                                        <div class="note-container">
                                            <span class="note-text" id="note-${row._sheetName}-${row._rowIndex}">${val}</span>
                                            ${!isClosed ? `<span class="edit-icon" title="Sửa ghi chú" onclick="editNote('${row._sheetName}', ${row._rowIndex})">✏️</span>` : ''}
                                        </div>
                                    </td>`;
                                } 
                                else if (header.toLowerCase().includes('trạng thái')) {
                                    let statusClass = strVal === 'chưa đóng' ? 'status-unpaid' : (strVal === 'đã đóng' ? 'status-paid' : '');
                                    tbodyHtml += `<td class="normal-cell"><span class="status-badge ${statusClass}">${val}</span></td>`;
                                } else {
                                    tbodyHtml += `<td class="normal-cell">${val}</td>`;
                                }
                            }

                            if (header.toLowerCase() === 'thành tiền') {
                                amountColumnIndex = index;
                                let num = parseInt(String(val).replace(/\./g, '').replace(/,/g, ''));
                                if(!isNaN(num)) {
                                    groupTotal += num;
                                    if(isDebt) {
                                        totalDebt += num;
                                    } else {
                                        totalCurrent += num;
                                    }
                                }
                            }
                        });
                        
                        if(currentViewMode === 'mark_paid') {
                            tbodyHtml += `<td class="col-action normal-cell"><button class="mark-btn" onclick="updateStatus('${row._sheetName}', ${row._rowIndex}, this, 'đã đóng')">Đóng tiền</button></td>`;
                        } else if (currentViewMode === 'paid') {
                            tbodyHtml += `<td class="col-action normal-cell"><button class="undo-btn" onclick="updateStatus('${row._sheetName}', ${row._rowIndex}, this, 'chưa đóng')">Hoàn tác</button></td>`;
                        } else if (currentViewMode === 'all') {
                            tbodyHtml += `<td class="col-action normal-cell"><button class="mark-btn" style="background-color: #17a2b8; min-width: 90px;" onclick="applyDiscount('${row._sheetName}', ${row._rowIndex})">Miễn/Giảm</button></td>`;
                        }
                        tbodyHtml += `</tr>`;
                    });

                    if (currentViewMode !== 'ds' && currentViewMode !== 'closed_data' && titleText !== "") {
                        let subTotalText = isDebt ? `Tổng nợ tháng ${debtMonth} năm ${debtYear}` : `Tổng tháng ${extractedMonth} năm ${extractedYear}`;
                        tbodyHtml += `
                        <tr class="subtotal-row ${subtotalClass}">
                            <td colspan="${amountColumnIndex}" style="text-align: right;">${subTotalText}</td>
                            <td>${groupTotal.toLocaleString('vi-VN')}</td>
                            <td colspan="${headers.length - amountColumnIndex - 1 + (isActionView ? 1 : 0)}"></td>
                        </tr>`;
                    }
                }

                if (currentDataList.length > 0) {
                    let currentTitle = (currentViewMode === 'ds') ? "" : `Tháng ${extractedMonth} năm ${extractedYear}`;
                    renderRowGroup(currentDataList, currentTitle, false, null, null);
                }

                let debtKeys = Object.keys(debtGroups);
                if (debtKeys.length > 0) {
                    tbodyHtml += `<tr class="section-divider title-debt"><td colspan="${totalColumns}">Nợ</td></tr>`;
                    
                    debtKeys.sort((a, b) => {
                        let ya = parseInt(debtGroups[a].year) || 0;
                        let yb = parseInt(debtGroups[b].year) || 0;
                        if (ya !== yb) return ya - yb;
                        return (parseInt(debtGroups[a].month) || 0) - (parseInt(debtGroups[b].month) || 0);
                    });
                    
                    debtKeys.forEach(key => {
                        let group = debtGroups[key];
                        renderRowGroup(group.rows, `Nợ tháng ${group.month} năm ${group.year}`, true, group.month, group.year);
                    });

                    tbodyHtml += `
                    <tr class="subtotal-row title-debt" style="font-size: 16px;">
                        <td colspan="${amountColumnIndex}" style="text-align: right;">Tổng Nợ:</td>
                        <td>${totalDebt.toLocaleString('vi-VN')}</td>
                        <td colspan="${headers.length - amountColumnIndex - 1 + (isActionView ? 1 : 0)}"></td>
                    </tr>`;
                }
            } 

            document.getElementById('tableBody').innerHTML = tbodyHtml;

            if(amountColumnIndex !== -1) {
                if (currentViewMode === 'ds') {
                    let colspanLeft = amountColumnIndex + 1; 
                    let remainingCols = headers.length - amountColumnIndex - 1;
                    let emptyCells = remainingCols > 0 ? `<td colspan="${remainingCols}"></td>` : '';
                    
                    document.getElementById('tableFoot').innerHTML = `
                        <tr class="total-row">
                            <td colspan="${colspanLeft}" style="text-align: right;">TỔNG CỘNG:</td>
                            <td>${totalCurrent.toLocaleString('vi-VN')}</td>
                            ${emptyCells}
                        </tr>`;
                } else if (currentViewMode === 'rep_search') {
                    let remainingCols = headers.length - amountColumnIndex - 1 + (isActionView ? 1 : 0);
                    let emptyCells = remainingCols > 0 ? `<td colspan="${remainingCols}"></td>` : '';
                    
                    document.getElementById('tableFoot').innerHTML = `
                        <tr class="total-row" style="background-color: #343a40; color: white;">
                            <td colspan="${amountColumnIndex}" style="text-align: right;">TỔNG CỘNG ĐANG HIỂN THỊ:</td>
                            <td>${totalCurrent.toLocaleString('vi-VN')}</td>
                            ${emptyCells}
                        </tr>`;
                } else {
                    let remainingCols = headers.length - amountColumnIndex - 1 + (isActionView ? 1 : 0);
                    let emptyCells = remainingCols > 0 ? `<td colspan="${remainingCols}"></td>` : '';
                    let grandTotal = totalCurrent + totalDebt;
                    
                    document.getElementById('tableFoot').innerHTML = `
                        <tr class="total-row">
                            <td colspan="${amountColumnIndex}" style="text-align: right;">TỔNG CỘNG THU:</td>
                            <td>${grandTotal.toLocaleString('vi-VN')}</td>
                            ${emptyCells}
                        </tr>`;
                }
            } else {
                 document.getElementById('tableFoot').innerHTML = ''; 
            }
        }

        function applyDiscount(rowSheetName, rowIndex) {
            let rowData = globalData.find(r => r._rowIndex === rowIndex && r._sheetName === rowSheetName);
            let currentTien = rowData['Thành tiền'] !== undefined ? rowData['Thành tiền'] : '';
            let currentNote = rowData['Ghi chú'] !== undefined ? rowData['Ghi chú'] : '';

            Swal.fire({
                title: 'Thực hiện Miễn / Giảm',
                html: `
                    <div style="text-align: left; padding: 0 5px;">
                        <label style="font-weight: bold; color: #333; display: block; margin-bottom: 5px;">Số tiền mới (VNĐ):</label>
                        <input id="swal-tien" type="text" class="swal2-input" style="width: 100%; max-width: 100%; margin: 0 0 15px 0; box-sizing: border-box;" placeholder="Nhập 0 nếu miễn hoàn toàn" value="${currentTien}">
                        <label style="font-weight: bold; color: #dc3545; display: block; margin-bottom: 5px;">Lý do (Bắt buộc phải nhập):</label>
                        <input id="swal-lydo" type="text" class="swal2-input" style="width: 100%; max-width: 100%; margin: 0; box-sizing: border-box;" placeholder="VD: Bệnh, nghỉ bán..." value="${currentNote}">
                    </div>
                `,
                showCancelButton: true, 
                confirmButtonText: 'Lưu thay đổi', 
                cancelButtonText: 'Hủy bỏ', 
                confirmButtonColor: '#17a2b8',
                didOpen: () => {
                    const inputTien = document.getElementById('swal-tien');
                    inputTien.addEventListener('input', function(e) { 
                        formatCurrencyInput(this); 
                    });
                },
                preConfirm: () => {
                    let tien = document.getElementById('swal-tien').value;
                    let lydo = document.getElementById('swal-lydo').value;
                    if (!lydo.trim()) { 
                        Swal.showValidationMessage('🛑 BẮT BUỘC phải nhập lý do miễn/giảm!'); 
                        return false; 
                    }
                    if (tien.trim() === '') { 
                        Swal.showValidationMessage('🛑 Vui lòng nhập số tiền!'); 
                        return false; 
                    }
                    return { tien: tien, note: lydo };
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    let newTien = result.value.tien; 
                    let newNote = result.value.note;

                    Swal.fire({ 
                        title: 'Đang xử lý...', 
                        allowOutsideClick: false, 
                        didOpen: () => { 
                            Swal.showLoading(); 
                        } 
                    });

                    fetch(API_URL, {
                        method: 'POST', 
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ sheetName: rowSheetName, rowIndex: rowIndex, updateType: 'discount', tien: newTien, note: newNote })
                    })
                    .then(r => r.json())
                    .then(res => {
                        if (res.success) {
                            rowData['Thành tiền'] = newTien; 
                            rowData['Ghi chú'] = newNote; 
                            renderTable(); 
                            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Cập nhật thành công!', showConfirmButton: false, timer: 3000 });
                        } else { 
                            Swal.fire('Lỗi!', res.message, 'error'); 
                        }
                    })
                    .catch(err => { 
                        Swal.fire('Lỗi kết nối!', 'Không thể kết nối đến máy chủ.', 'error'); 
                    });
                }
            });
        }

        function editRowInfo(rowSheetName, rowIndex) {
            let rowData = globalData.find(r => r._rowIndex === rowIndex && r._sheetName === rowSheetName);
            if (!rowData) {
                return;
            }

            let editableHeaders = Object.keys(rowData).filter(h => h !== '_rowIndex' && h !== '_sheetName' && h !== '_daiDien' && !h.toLowerCase().includes('đại diện') && !h.toLowerCase().includes('trạng thái'));
            
            let optionsObj = {}; 
            editableHeaders.forEach(h => { 
                optionsObj[h] = h; 
            });

            Swal.fire({
                title: 'Chọn thông tin cần sửa', 
                input: 'select', 
                inputOptions: optionsObj, 
                inputPlaceholder: '--- Chọn cột dữ liệu ---',
                showCancelButton: true, 
                confirmButtonText: 'Tiếp tục', 
                cancelButtonText: 'Hủy'
            }).then((result) => {
                if (result.isConfirmed && result.value) {
                    let selectedColumn = result.value;
                    let currentValue = rowData[selectedColumn] !== undefined ? rowData[selectedColumn] : '';
                    
                    Swal.fire({
                        title: `Chỉnh sửa: ${selectedColumn}`, 
                        input: 'text', 
                        inputValue: currentValue,
                        showCancelButton: true, 
                        confirmButtonText: 'Lưu thay đổi', 
                        cancelButtonText: 'Quay lại', 
                        confirmButtonColor: '#007bff',
                        didOpen: () => {
                            if (selectedColumn.toLowerCase().includes('tiền') || selectedColumn.toLowerCase().includes('mức thu')) {
                                const inputEl = Swal.getInput();
                                inputEl.addEventListener('input', function(e) { 
                                    formatCurrencyInput(this); 
                                });
                            }
                        }
                    }).then((editResult) => {
                        if (editResult.isConfirmed) {
                            let newValue = editResult.value;
                            if (newValue === currentValue) {
                                return;
                            }

                            Swal.fire({ 
                                title: 'Đang lưu...', 
                                allowOutsideClick: false, 
                                didOpen: () => { 
                                    Swal.showLoading(); 
                                } 
                            });

                            fetch(API_URL, {
                                method: 'POST', 
                                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                body: JSON.stringify({ sheetName: rowSheetName, rowIndex: rowIndex, updateType: 'edit_cell', colName: selectedColumn, value: newValue })
                            })
                            .then(r => r.json())
                            .then(res => {
                                if(res.success) {
                                    rowData[selectedColumn] = newValue; 
                                    renderTable(); 
                                    Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Đã lưu thay đổi!', showConfirmButton: false, timer: 2000 });
                                } else { 
                                    Swal.fire('Lỗi!', res.message, 'error'); 
                                }
                            })
                            .catch(err => { 
                                Swal.fire('Lỗi kết nối!', 'Không thể kết nối đến máy chủ.', 'error'); 
                            });
                        }
                    });
                }
            });
        }

        function editNote(rowSheetName, rowIndex) {
            let rowData = globalData.find(r => r._rowIndex === rowIndex && r._sheetName === rowSheetName);
            let currentNote = rowData['Ghi chú'] !== undefined ? rowData['Ghi chú'] : '';
            
            Swal.fire({
                title: 'Chỉnh sửa Ghi chú', 
                input: 'text', 
                inputLabel: `Nhập nội dung ghi chú mới:`, 
                inputValue: currentNote,
                showCancelButton: true, 
                confirmButtonText: 'Lưu thay đổi', 
                cancelButtonText: 'Hủy bỏ', 
                confirmButtonColor: '#007bff'
            }).then((result) => {
                if (result.isConfirmed) {
                    let newNote = result.value;
                    if (newNote === currentNote) {
                        return; 
                    }

                    let noteElement = document.getElementById(`note-${rowSheetName}-${rowIndex}`);
                    let oldText = noteElement.innerText; 
                    noteElement.innerText = "⏳..."; 

                    fetch(API_URL, {
                        method: 'POST', 
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ sheetName: rowSheetName, rowIndex: rowIndex, updateType: 'note', value: newNote })
                    })
                    .then(r => r.json())
                    .then(res => {
                        if(res.success) {
                            rowData['Ghi chú'] = newNote; 
                            noteElement.innerText = newNote; 
                            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Đã lưu ghi chú!', showConfirmButton: false, timer: 2000 });
                        } else { 
                            Swal.fire('Lỗi!', res.message, 'error'); 
                            noteElement.innerText = oldText; 
                        }
                    })
                    .catch(err => { 
                        Swal.fire('Lỗi!', 'Không kết nối được.', 'error'); 
                        noteElement.innerText = oldText; 
                    });
                }
            });
        }

        function updateStatus(rowSheetName, rowIndex, btnElement, newStatus) {
            let isCollecting = (newStatus === 'đã đóng');
            let titleText = isCollecting ? 'Xác nhận thu tiền?' : 'Xác nhận hoàn tác?';
            let confirmText = isCollecting ? 'Đóng tiền' : 'Đồng ý hoàn tác';
            let confirmColor = isCollecting ? '#28a745' : '#dc3545';

            Swal.fire({
                title: titleText, 
                text: `Trạng thái chuyển thành: ${newStatus.toUpperCase()}`, 
                icon: 'question',
                showCancelButton: true, 
                confirmButtonColor: confirmColor, 
                cancelButtonColor: '#6c757d', 
                confirmButtonText: confirmText, 
                cancelButtonText: 'Hủy'
            }).then((result) => {
                if (result.isConfirmed) {
                    let originalText = btnElement.innerText;
                    btnElement.innerText = "⏳..."; 
                    btnElement.disabled = true;

                    fetch(API_URL, {
                        method: 'POST', 
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ sheetName: rowSheetName, rowIndex: rowIndex, updateType: 'status', value: newStatus })
                    })
                    .then(r => r.json())
                    .then(res => {
                        if(res.success) {
                            let rowData = globalData.find(r => r._rowIndex === rowIndex && r._sheetName === rowSheetName);
                            if(rowData) {
                                rowData['Trạng thái'] = newStatus;
                            }
                            
                            let tr = btnElement.closest('tr');
                            let badge = tr.querySelector('.status-badge');
                            
                            if (badge) { 
                                badge.innerText = newStatus; 
                                badge.className = isCollecting ? 'status-badge status-paid' : 'status-badge status-unpaid'; 
                            }
                            
                            if (isCollecting) {
                                btnElement.innerText = "Hoàn tác"; 
                                btnElement.className = "undo-btn";
                                btnElement.setAttribute('onclick', `updateStatus('${rowSheetName}', ${rowIndex}, this, 'chưa đóng')`);
                                
                                if(!tr.style.backgroundColor) {
                                    tr.classList.add('row-success'); 
                                }
                                Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Đã thu tiền!', showConfirmButton: false, timer: 2000 });
                            } else {
                                btnElement.innerText = "Đóng tiền"; 
                                btnElement.className = "mark-btn";
                                btnElement.setAttribute('onclick', `updateStatus('${rowSheetName}', ${rowIndex}, this, 'đã đóng')`);
                                tr.classList.remove('row-success'); 
                                Swal.fire({ toast: true, position: 'top-end', icon: 'info', title: 'Đã hoàn tác!', showConfirmButton: false, timer: 2000 });
                            }
                            btnElement.disabled = false;
                        } else { 
                            Swal.fire('Lỗi!', res.message, 'error'); 
                            btnElement.innerText = originalText; 
                            btnElement.disabled = false; 
                        }
                    })
                    .catch(err => { 
                        Swal.fire('Lỗi!', 'Vui lòng kiểm tra mạng.', 'error'); 
                        btnElement.innerText = originalText; 
                        btnElement.disabled = false; 
                    });
                }
            });
        }
    </script>
</body>
</html>
